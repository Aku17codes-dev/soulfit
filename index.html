<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akhara — gym tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shutter"></div>

<section id="gate">
  <div class="gate-in">
    <h1 class="logo"><span>Akhara</span></h1>
    <p class="sub">No password. Enter your member ID, type the code, and your time is stamped in the register.</p>

    <label for="mid">Member ID</label>
    <input class="blank" id="mid" placeholder="GYM-0000" maxlength="12" autocomplete="off">

    <label for="cap">Type the code you see</label>
    <div class="caprow">
      <svg id="capsvg" viewBox="0 0 172 62"></svg>
      <button id="capReload" type="button" aria-label="New code">↻</button>
      <input id="cap" placeholder="CODE" maxlength="5" autocomplete="off">
    </div>

    <button class="btn wide" id="signin">Sign in</button>
    <p class="err" id="gateErr" role="alert"></p>
    <p class="tiny">New here? <button class="link" id="newId">Generate a member ID</button></p>
    <div id="ticket" class="ticket"></div>
  </div>
</section>

<div id="app" hidden>
  <header><b class="brand">AK<i>H</i>ARA</b><span id="who"></span></header>
  <nav id="tabs">
    <button data-v="mark">Day marker</button>
    <button data-v="week">Week plan</button>
    <button data-v="diet">Diet</button>
    <button data-v="out">Sign out</button>
  </nav>

  <main>
    <section class="view" id="v-mark">
      <h2>Mark today</h2>
      <div class="card">
        <label for="mdate">Date</label><input type="date" id="mdate">
        <label for="mday">Day number</label><input type="number" id="mday" min="1" max="365">
        <button class="btn wide" id="markBtn">Mark this day done</button>
        <p class="err" id="markErr"></p>
      </div>
      <p class="tiny" id="count"></p>
    </section>

    <section class="view" id="v-week"><h2>Weekly target</h2><div id="weekList"></div></section>

    <section class="view" id="v-diet">
      <h2>Diet in rupees</h2>
      <div id="plans"></div><div id="meals"></div>
      <div class="total"><span>Per day</span><b id="tot"></b></div>
    </section>

    <section class="view" id="v-out">
      <h2 class="bye">Done for today</h2>
      <p class="tiny">Signing out stamps your OUT TIME in the sheet.</p>
      <button class="btn" id="outBtn">Sign out</button>
    </section>
  </main>
</div>

<div id="stamp"><div class="stamp-card">
  <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/><path d="M29 51 L44 66 L73 34"/></svg>
  <span id="emo">💪</span><h3 id="stT"></h3><p id="stS"></p>
  <button class="btn" id="stX">Back</button>
</div></div>
<script src="app.js"></script>
</body>
</html>
